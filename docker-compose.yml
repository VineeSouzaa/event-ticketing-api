services:
  postgres:
    # Host port 5435 (not the default 5432) — this machine already runs other local Postgres
    # containers (RUK projects) on 5432/5433/5434. Internal container port stays 5432.
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: event_ticketing
      POSTGRES_PASSWORD: event_ticketing
      POSTGRES_DB: event_ticketing
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U event_ticketing"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: event_ticketing
      MONGO_INITDB_ROOT_PASSWORD: event_ticketing
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  mongo_data:
